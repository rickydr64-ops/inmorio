<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="45%" stop-color="#122036"/>
      <stop offset="75%" stop-color="#1B3049"/>
      <stop offset="100%" stop-color="#22405C"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#D9A857" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#D9A857" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D9A857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060A12" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D9A857" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D9A857" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D9A857" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Faint stars -->
  <g fill="#EAF2FF" opacity="0.5">
    <circle cx="180" cy="90" r="1.4"/>
    <circle cx="420" cy="150" r="1"/>
    <circle cx="760" cy="70" r="1.2"/>
    <circle cx="990" cy="120" r="1"/>
    <circle cx="1240" cy="60" r="1.3"/>
    <circle cx="1520" cy="140" r="1"/>
    <circle cx="1700" cy="90" r="1.4"/>
    <circle cx="1840" cy="180" r="1"/>
    <circle cx="90" cy="220" r="1"/>
    <circle cx="1350" cy="200" r="1"/>
  </g>

  <!-- Distant skyline (back layer, faint) -->
  <g fill="#16283F" opacity="0.7">
    <rect x="0" y="620" width="70" height="360"/>
    <rect x="90" y="560" width="55" height="420"/>
    <rect x="160" y="650" width="90" height="330"/>
    <rect x="270" y="590" width="60" height="390"/>
    <rect x="350" y="670" width="100" height="310"/>
    <rect x="470" y="540" width="50" height="440"/>
    <rect x="1450" y="560" width="60" height="420"/>
    <rect x="1530" y="620" width="90" height="360"/>
    <rect x="1640" y="580" width="55" height="400"/>
    <rect x="1710" y="650" width="100" height="330"/>
    <rect x="1830" y="600" width="60" height="380"/>
  </g>

  <!-- Midground skyline -->
  <g fill="#0F1D30">
    <rect x="520" y="480" width="90" height="500"/>
    <rect x="630" y="420" width="70" height="560"/>
    <rect x="1180" y="440" width="80" height="540"/>
    <rect x="1280" y="500" width="60" height="480"/>
  </g>

  <!-- Hero building cluster (foreground, architectural line style) -->
  <g>
    <!-- Central tower -->
    <rect x="820" y="300" width="140" height="680" fill="#0A1626"/>
    <rect x="820" y="300" width="140" height="680" fill="none" stroke="#D9A857" stroke-opacity="0.35" stroke-width="1"/>
    <!-- Window grid, central tower -->
    <g stroke="#D9A857" stroke-opacity="0.28" stroke-width="1">
      <path d="M840 320 V960"/>
      <path d="M865 320 V960"/>
      <path d="M890 320 V960"/>
      <path d="M915 320 V960"/>
      <path d="M940 320 V960"/>
    </g>
    <g stroke="#D9A857" stroke-opacity="0.22" stroke-width="1">
      <path d="M820 360 H960"/>
      <path d="M820 410 H960"/>
      <path d="M820 460 H960"/>
      <path d="M820 510 H960"/>
      <path d="M820 560 H960"/>
      <path d="M820 610 H960"/>
      <path d="M820 660 H960"/>
      <path d="M820 710 H960"/>
      <path d="M820 760 H960"/>
      <path d="M820 810 H960"/>
      <path d="M820 860 H960"/>
      <path d="M820 910 H960"/>
    </g>
    <!-- rooftop accent line -->
    <rect x="880" y="270" width="20" height="30" fill="#0A1626" stroke="#D9A857" stroke-opacity="0.5"/>
    <circle cx="890" cy="262" r="3" fill="#D9A857" opacity="0.85"/>

    <!-- Left tower -->
    <rect x="660" y="440" width="120" height="540" fill="#0C1A2C"/>
    <rect x="660" y="440" width="120" height="540" fill="none" stroke="#D9A857" stroke-opacity="0.28" stroke-width="1"/>
    <g stroke="#D9A857" stroke-opacity="0.18" stroke-width="1">
      <path d="M680 460 V980"/>
      <path d="M705 460 V980"/>
      <path d="M730 460 V980"/>
      <path d="M755 460 V980"/>
    </g>
    <g stroke="#D9A857" stroke-opacity="0.15" stroke-width="1">
      <path d="M660 490 H780"/>
      <path d="M660 540 H780"/>
      <path d="M660 590 H780"/>
      <path d="M660 640 H780"/>
      <path d="M660 690 H780"/>
      <path d="M660 740 H780"/>
      <path d="M660 790 H780"/>
      <path d="M660 840 H780"/>
      <path d="M660 890 H780"/>
      <path d="M660 940 H780"/>
    </g>

    <!-- Right tower -->
    <rect x="1000" y="400" width="130" height="580" fill="#0C1A2C"/>
    <rect x="1000" y="400" width="130" height="580" fill="none" stroke="#D9A857" stroke-opacity="0.28" stroke-width="1"/>
    <g stroke="#D9A857" stroke-opacity="0.18" stroke-width="1">
      <path d="M1022 420 V980"/>
      <path d="M1047 420 V980"/>
      <path d="M1072 420 V980"/>
      <path d="M1097 420 V980"/>
      <path d="M1122 420 V980"/>
    </g>
    <g stroke="#D9A857" stroke-opacity="0.15" stroke-width="1">
      <path d="M1000 450 H1130"/>
      <path d="M1000 500 H1130"/>
      <path d="M1000 550 H1130"/>
      <path d="M1000 600 H1130"/>
      <path d="M1000 650 H1130"/>
      <path d="M1000 700 H1130"/>
      <path d="M1000 750 H1130"/>
      <path d="M1000 800 H1130"/>
      <path d="M1000 850 H1130"/>
      <path d="M1000 900 H1130"/>
      <path d="M1000 950 H1130"/>
    </g>
  </g>

  <!-- Thin gold horizon line -->
  <rect x="0" y="978" width="1920" height="1.5" fill="url(#goldLine)"/>

  <!-- Ground fade for text legibility -->
  <rect width="1920" height="1080" fill="url(#fadeGround)"/>

  <!-- Overall vignette for readability -->
  <rect width="1920" height="1080" fill="#050810" opacity="0.18"/>
</svg>
