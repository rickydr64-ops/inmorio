<script type="module">


    import {
        createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    /*
    =====================================
    CONFIGURACIÓN SUPABASE
    =====================================
    */

    const SUPABASE_URL =
        "https://suvhbicsdldrncwkwzdz.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_9qelxkXyfJopNRFMN41JGA_vleUoVW5";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    /*
    =====================================
    OBTENER ID
    =====================================
    */

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const id =
        parametros.get("id");



    /*
    =====================================
    ELEMENTOS
    =====================================
    */

    const imagen =
        document.getElementById(
            "imagenPropiedad"
        );


    const tipo =
        document.getElementById(
            "tipoPropiedad"
        );


    const nombre =
        document.getElementById(
            "nombrePropiedad"
        );


    const ubicacion =
        document.getElementById(
            "ubicacionPropiedad"
        );


    const precio =
        document.getElementById(
            "precioPropiedad"
        );


    const habitaciones =
        document.getElementById(
            "habitaciones"
        );


    const banos =
        document.getElementById(
            "banos"
        );


    const area =
        document.getElementById(
            "area"
        );


    const descripcion =
        document.getElementById(
            "descripcionPropiedad"
        );


    const estado =
        document.getElementById(
            "estadoPropiedad"
        );


    const anterior =
        document.getElementById(
            "anterior"
        );


    const siguiente =
        document.getElementById(
            "siguiente"
        );


    const contador =
        document.getElementById(
            "contadorFotos"
        );


    const indicadores =
        document.getElementById(
            "indicadores"
        );



    /*
    =====================================
    VARIABLES DE GALERÍA
    =====================================
    */

    let imagenes = [];

    let indiceActual = 0;



    /*
    =====================================
    CONVERTIR IMAGEN A ARRAY
    =====================================

    Esto permite trabajar con:

    1. Una imagen antigua:
    "https://..."

    2. Varias imágenes:
    ["https://...", "https://..."]

    3. JSON guardado como texto:
    '["https://...", "https://..."]'
    */

    function prepararImagenes(valor) {

        if (!valor) {

            return [];

        }


        if (Array.isArray(valor)) {

            return valor.filter(
                imagen => imagen
            );

        }


        if (typeof valor === "string") {

            try {

                const posibles =
                    JSON.parse(valor);


                if (Array.isArray(posibles)) {

                    return posibles.filter(
                        imagen => imagen
                    );

                }

            }
            catch (error) {

                // Es una URL normal.
            }


            return [valor];

        }


        return [];

    }



    /*
    =====================================
    MOSTRAR IMAGEN
    =====================================
    */

    function mostrarImagen() {

        if (!imagenes.length) {

            imagen.style.display =
                "none";

            anterior.classList.add(
                "galeria-oculta"
            );

            siguiente.classList.add(
                "galeria-oculta"
            );

            contador.classList.add(
                "galeria-oculta"
            );

            indicadores.innerHTML =
                "";

            return;

        }


        imagen.style.display =
            "block";


        imagen.src =
            imagenes[indiceActual];


        imagen.alt =
            nombre.textContent
            || "Propiedad INMORIO";


        /*
        CONTADOR
        */

        contador.textContent =
            `${indiceActual + 1} / ${imagenes.length}`;


        /*
        INDICADORES
        */

        indicadores.innerHTML =
            imagenes.map(
                (_, index) => `

                    <span
                        class="galeria-indicador
                        ${index === indiceActual ? "activo" : ""}"
                        data-index="${index}">
                    </span>

                `
            ).join("");


        /*
        SI SOLO HAY UNA FOTO
        */

        if (imagenes.length <= 1) {

            anterior.classList.add(
                "galeria-oculta"
            );

            siguiente.classList.add(
                "galeria-oculta"
            );

            contador.classList.add(
                "galeria-oculta"
            );

        }

        else {

            anterior.classList.remove(
                "galeria-oculta"
            );

            siguiente.classList.remove(
                "galeria-oculta"
            );

            contador.classList.remove(
                "galeria-oculta"
            );

        }


        /*
        CLICK EN INDICADORES
        */

        document
            .querySelectorAll(
                ".galeria-indicador"
            )
            .forEach(
                indicador => {

                    indicador.addEventListener(
                        "click",
                        () => {

                            indiceActual =
                                Number(
                                    indicador.dataset.index
                                );

                            mostrarImagen();

                        }
                    );

                }
            );

    }



    /*
    =====================================
    FOTO ANTERIOR
    =====================================
    */

    anterior.addEventListener(
        "click",
        () => {

            if (!imagenes.length) {

                return;

            }


            indiceActual--;

            if (indiceActual < 0) {

                indiceActual =
                    imagenes.length - 1;

            }


            mostrarImagen();

        }
    );



    /*
    =====================================
    FOTO SIGUIENTE
    =====================================
    */

    siguiente.addEventListener(
        "click",
        () => {

            if (!imagenes.length) {

                return;

            }


            indiceActual++;

            if (
                indiceActual >=
                imagenes.length
            ) {

                indiceActual = 0;

            }


            mostrarImagen();

        }
    );



    /*
    =====================================
    COMPROBAR ID
    =====================================
    */

    if (!id) {

        nombre.textContent =
            "Propiedad no encontrada";


        descripcion.textContent =
            "No se recibió el identificador de la propiedad.";

    }

    else {


        /*
        =====================================
        BUSCAR PROPIEDAD
        =====================================
        */

        const {
            data,
            error
        } =
            await supabase
                .from("Inmorio")
                .select("*")
                .eq(
                    "id",
                    id
                )
                .single();



        console.log(
            "ID recibido:",
            id
        );


        console.log(
            "DATOS RECIBIDOS:",
            data
        );


        console.log(
            "ERROR:",
            error
        );



        /*
        =====================================
        ERROR
        =====================================
        */

        if (error) {

            console.error(
                "Error cargando propiedad:",
                error
            );


            nombre.textContent =
                "Propiedad no encontrada";


            descripcion.textContent =
                "No se pudo encontrar esta propiedad.";

        }

        else {


            /*
            =====================================
            MOSTRAR INFORMACIÓN
            =====================================
            */

            tipo.textContent =
                data.tipo
                    ?.toUpperCase()
                    || "PROPIEDAD";


            nombre.textContent =
                data.nombre
                    || "Propiedad INMORIO";


            ubicacion.textContent =
                "📍 " +
                (
                    data.ubicacion
                    || "Ubicación no disponible"
                );


            precio.textContent =
                "$" +
                Number(
                    data.precio || 0
                ).toLocaleString();


            habitaciones.textContent =
                data.habitaciones !== null
                &&
                data.habitaciones !== undefined
                    ? data.habitaciones
                    : "—";


            banos.textContent =
                data.banos !== null
                &&
                data.banos !== undefined
                    ? data.banos
                    : "—";


            area.textContent =
                data.area !== null
                &&
                data.area !== undefined
                    ? data.area + " m²"
                    : "—";


            descripcion.textContent =
                data.descripcion
                    || "No hay una descripción disponible para esta propiedad.";


            estado.textContent =
                data.estado
                    || "Disponible";



            /*
            =====================================
            CARGAR TODAS LAS IMÁGENES
            =====================================
            */

            imagenes =
                prepararImagenes(
                    data.imagen
                );


            indiceActual = 0;


            mostrarImagen();



            /*
            =====================================
            TÍTULO
            =====================================
            */

            document.title =
                (
                    data.nombre
                    || "Propiedad"
                )
                + " | INMORIO";

        }

    }



    /*
    =====================================
    CAMBIAR FOTO CON TECLADO
    =====================================
    */

    document.addEventListener(
        "keydown",
        (event) => {

            if (imagenes.length <= 1) {

                return;

            }


            if (
                event.key ===
                "ArrowLeft"
            ) {

                anterior.click();

            }


            if (
                event.key ===
                "ArrowRight"
            ) {

                siguiente.click();

            }

        }
    );

</script>
