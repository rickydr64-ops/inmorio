<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Propiedad | INMORIO</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            INMORIO
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="propiedades.html">Propiedades</a>
            <a href="Nosotros.html">Nosotros</a>
            <a href="Contacto.html">Contacto</a>
        </nav>

    </header>


    <main class="detalle-propiedad">

        <section class="detalle-contenido">

            <div class="detalle-imagen">

                <img id="imagenPropiedad" src="" alt="Propiedad">

            </div>


            <div class="detalle-info">

                <p class="subtitle" id="tipoPropiedad">
                    PROPIEDAD
                </p>

                <h1 id="nombrePropiedad">
                    Cargando...
                </h1>

                <p class="detalle-ubicacion" id="ubicacionPropiedad">
                    📍 Cargando...
                </p>

                <div class="detalle-precio" id="precioPropiedad">
                    $0
                </div>


                <div class="detalle-caracteristicas">

                    <div>
                        <strong id="habitaciones">-</strong>
                        <span>Habitaciones</span>
                    </div>

                    <div>
                        <strong id="banos">-</strong>
                        <span>Baños</span>
                    </div>

                    <div>
                        <strong id="area">-</strong>
                        <span>Área</span>
                    </div>

                </div>


                <div class="detalle-descripcion">

                    <h2>Descripción</h2>

                    <p id="descripcionPropiedad">
                        Cargando información...
                    </p>

                </div>


                <a href="contacto.html" class="boton-contacto">
                    ESTOY INTERESADO
                </a>

            </div>

        </section>

    </main>


    <script>

        const propiedades = {

            casa1: {
                tipo: "CASA",
                nombre: "Casa Moderna",
                ubicacion: "Riobamba",
                precio: "$120.000",
                habitaciones: "3",
                banos: "2",
                area: "180 m²",
                imagen: "imagenes/riobamba.jpeg",
                descripcion:
                    "Hermosa casa moderna ubicada en Riobamba, ideal para familias que buscan comodidad, tranquilidad y un espacio acogedor."
            },

            depto1: {
                tipo: "DEPARTAMENTO",
                nombre: "Departamento Central",
                ubicacion: "Riobamba",
                precio: "$85.000",
                habitaciones: "2",
                banos: "2",
                area: "95 m²",
                imagen: "imagenes/riobamba.jpeg",
                descripcion:
                    "Cómodo departamento ubicado en una zona estratégica de Riobamba, ideal para vivir con comodidad y tener acceso a los principales servicios."
            },

            terreno1: {
                tipo: "TERRENO",
                nombre: "Terreno Residencial",
                ubicacion: "Riobamba",
                precio: "$60.000",
                habitaciones: "—",
                banos: "—",
                area: "250 m²",
                imagen: "imagenes/riobamba.jpeg",
                descripcion:
                    "Terreno residencial con excelente potencial para construir una vivienda o desarrollar un proyecto inmobiliario."
            }

        };


        const parametros = new URLSearchParams(window.location.search);

        const id = parametros.get("id");

        const propiedad = propiedades[id];


        if (propiedad) {

            document.getElementById("tipoPropiedad").textContent =
                propiedad.tipo;

            document.getElementById("nombrePropiedad").textContent =
                propiedad.nombre;

            document.getElementById("ubicacionPropiedad").textContent =
                "📍 " + propiedad.ubicacion;

            document.getElementById("precioPropiedad").textContent =
                propiedad.precio;

            document.getElementById("habitaciones").textContent =
                propiedad.habitaciones;

            document.getElementById("banos").textContent =
                propiedad.banos;

            document.getElementById("area").textContent =
                propiedad.area;

            document.getElementById("descripcionPropiedad").textContent =
                propiedad.descripcion;

            document.getElementById("imagenPropiedad").src =
                propiedad.imagen;

            document.getElementById("imagenPropiedad").alt =
                propiedad.nombre;

            document.title =
                propiedad.nombre + " | INMORIO";

        } else {

            document.getElementById("nombrePropiedad").textContent =
                "Propiedad no encontrada";

            document.getElementById("descripcionPropiedad").textContent =
                "La propiedad que buscas no existe o ya no está disponible.";

        }

    </script>

</body>

</html>
