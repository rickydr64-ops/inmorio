<!-- SUPABASE -->

<script type="module">


    import {
        createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";



    /*
    =====================================
    CONFIGURACIÓN SUPABASE
    =====================================
    */

    const SUPABASE_URL =
        "https://suvhbicsdldrncwkwzdz.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_9qelxKXyfJopNRFMN41JGA_vleUoVW5";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    /*
    =====================================
    OBTENER ID DE LA URL
    =====================================
    */

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const id =
        parametros.get("id");



    /*
    =====================================
    ELEMENTOS
    =====================================
    */

    const imagen =
        document.getElementById(
            "imagenPropiedad"
        );


    const tipo =
        document.getElementById(
            "tipoPropiedad"
        );


    const nombre =
        document.getElementById(
            "nombrePropiedad"
        );


    const ubicacion =
        document.getElementById(
            "ubicacionPropiedad"
        );


    const precio =
        document.getElementById(
            "precioPropiedad"
        );


    const habitaciones =
        document.getElementById(
            "habitaciones"
        );


    const banos =
        document.getElementById(
            "banos"
        );


    const area =
        document.getElementById(
            "area"
        );


    const descripcion =
        document.getElementById(
            "descripcionPropiedad"
        );


    const estado =
        document.getElementById(
            "estadoPropiedad"
        );



    /*
    =====================================
    COMPROBAR ID
    =====================================
    */

    if (!id) {

        nombre.textContent =
            "Propiedad no encontrada";


        descripcion.textContent =
            "No se recibió el identificador de la propiedad.";


    } else {


        /*
        =====================================
        BUSCAR PROPIEDAD
        =====================================
        */

        const {
            data,
            error
        } =
            await supabase
                .from("Inmorio")
                .select("*")
                .eq(
                    "id",
                    id
                )
                .single();



        /*
        =====================================
        ERROR
        =====================================
        */

        if (error) {

            console.error(
                "Error cargando propiedad:",
                error
            );


            nombre.textContent =
                "Propiedad no encontrada";


            descripcion.textContent =
                "No se pudo encontrar esta propiedad.";


        } else {


            /*
            =====================================
            MOSTRAR DATOS
            =====================================
            */


            tipo.textContent =
                data.tipo
                    ?.toUpperCase()
                    || "PROPIEDAD";


            nombre.textContent =
                data.nombre
                    || "Propiedad INMORIO";


            ubicacion.textContent =
                "📍 " +
                (
                    data.ubicacion
                    || "Ubicación no disponible"
                );


            precio.textContent =
                "$" +
                Number(
                    data.precio || 0
                ).toLocaleString();


            descripcion.textContent =
                data.descripcion
                    || "No hay una descripción disponible para esta propiedad.";



            /*
            =====================================
            IMAGEN
            =====================================
            */

            if (data.imagen) {

                imagen.src =
                    data.imagen;

                imagen.alt =
                    data.nombre
                    || "Propiedad INMORIO";

            } else {

                imagen.style.display =
                    "none";

            }



            /*
            =====================================
            CARACTERÍSTICAS
            =====================================

            Como tu tabla actualmente no tiene
            habitaciones, baños ni área,
            dejamos estos campos como "—".
            */

            habitaciones.textContent =
                data.habitaciones
                || "—";


            banos.textContent =
                data.banos
                || "—";


            area.textContent =
                data.area
                || "—";



            /*
            =====================================
            ESTADO
            =====================================
            */

            estado.textContent =
                data.estado
                || "Disponible";



            /*
            =====================================
            TÍTULO DE LA PÁGINA
            =====================================
            */

            document.title =
                (
                    data.nombre
                    || "Propiedad"
                )
                + " | INMORIO";


        }

    }


</script>
