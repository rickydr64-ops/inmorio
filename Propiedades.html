<!-- SUPABASE -->

<script type="module">

    import {
        createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
        "https://suvhbicsdldrncwkwzdz.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_9qelxKXyfJopNRFMN41JGA_vleUoVW5";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let propiedades = [];


    /*
    =====================================
    CARGAR PROPIEDADES DESDE SUPABASE
    =====================================
    */

    async function cargarPropiedades() {

        const {
            data,
            error
        } = await supabase
            .from("inmorio")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Error cargando propiedades:",
                error
            );

            document
                .getElementById("propiedadesGrid")
                .innerHTML = `
                
                    <p style="text-align:center;">
                        No se pudieron cargar las propiedades.
                    </p>

                `;

            return;

        }


        propiedades = data || [];

        mostrarPropiedades("todas");

    }


    /*
    =====================================
    MOSTRAR PROPIEDADES
    =====================================
    */

    window.mostrarPropiedades =
        function(categoria) {

            const container =
                document.getElementById(
                    "propiedadesGrid"
                );


            const botones =
                document.querySelectorAll(
                    ".categoria"
                );


            botones.forEach(
                boton => {

                    boton.classList.remove(
                        "activa"
                    );

                }
            );


            botones.forEach(
                boton => {

                    if (
                        boton.textContent
                            .trim()
                            .toLowerCase()
                            .includes(
                                categoria === "todas"
                                    ? "todas"
                                    : categoria
                            )
                    ) {

                        boton.classList.add(
                            "activa"
                        );

                    }

                }
            );


            let filtradas =
                propiedades;


            if (categoria !== "todas") {

                filtradas =
                    propiedades.filter(
                        propiedad =>
                            propiedad.tipo
                                ?.toLowerCase()
                                === categoria
                    );

            }


            if (filtradas.length === 0) {

                container.innerHTML = `

                    <div style="
                        grid-column: 1 / -1;
                        text-align: center;
                        padding: 60px 20px;
                    ">

                        <h2>
                            No hay propiedades disponibles
                        </h2>

                        <p>
                            Actualmente no tenemos propiedades
                            de este tipo.
                        </p>

                    </div>

                `;

                return;

            }


            container.innerHTML =
                filtradas.map(
                    propiedad => `

                    <article
                        class="propiedad-card propiedad ${propiedad.tipo || ""}"
                    >

                        <div class="propiedad-imagen">

                            ${
                                propiedad.imagen

                                ?

                                `
                                <img
                                    src="${propiedad.imagen}"
                                    alt="${propiedad.nombre || "Propiedad INMORIO"}"
                                >
                                `

                                :

                                `
                                <div class="no-image">
                                    SIN IMAGEN
                                </div>
                                `
                            }


                            <span class="
                                estado
                                ${
                                    propiedad.estado
                                        ?.toLowerCase()
                                        === "vendida"
                                        ? "vendida"
                                        : "disponible"
                                }
                            ">

                                ${propiedad.estado || "DISPONIBLE"}

                            </span>

                        </div>


                        <div class="propiedad-info">

                            <p class="tipo-propiedad">

                                ${
                                    propiedad.tipo
                                        ?.toUpperCase()
                                        || "PROPIEDAD"
                                }

                            </p>


                            <h2>

                                ${
                                    propiedad.nombre
                                        || "Propiedad INMORIO"
                                }

                            </h2>


                            <p class="ubicacion">

                                📍
                                ${
                                    propiedad.ubicacion
                                        || "Ubicación no disponible"
                                }

                            </p>


                            <div class="propiedad-footer">

                                <strong>

                                    $${Number(
                                        propiedad.precio || 0
                                    ).toLocaleString()}

                                </strong>


                                <a
                                    href="propiedad.html?id=${propiedad.id}"
                                >
                                    VER MÁS
                                </a>

                            </div>

                        </div>

                    </article>

                `
                ).join("");

        };


    /*
    =====================================
    INICIAR
    =====================================
    */

    cargarPropiedades();

</script>
```
