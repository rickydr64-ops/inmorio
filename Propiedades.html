<!-- SUPABASE -->

<script type="module">

    import {
        createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
        "https://suvhbicsdldrncwkwzdz.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_9qelxkXyfJopNRFMN41JGA_vleUoVW5";


    const supabase =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let propiedades = [];



    /*
    =====================================
    CONVERTIR IMÁGENES
    =====================================
    */

    function obtenerPrimeraImagen(valor) {

        if (!valor) {

            return "";

        }


        /*
        SI YA ES UN ARRAY
        */

        if (Array.isArray(valor)) {

            return valor[0] || "";

        }


        /*
        SI ES TEXTO
        */

        if (typeof valor === "string") {

            const texto =
                valor.trim();


            /*
            INTENTAR LEER JSON
            */

            try {

                const resultado =
                    JSON.parse(texto);


                if (
                    Array.isArray(
                        resultado
                    )
                ) {

                    return resultado[0] || "";

                }


                if (
                    typeof resultado ===
                    "string"
                ) {

                    return resultado;

                }

            }

            catch (error) {

                /*
                NO ES JSON.

                ENTONCES SUPONEMOS
                QUE ES UNA URL NORMAL.
                */

            }


            return texto;

        }


        return "";

    }



    /*
    =====================================
    CARGAR PROPIEDADES
    =====================================
    */

    async function cargarPropiedades() {

        const {
            data,
            error
        } =
            await supabase
                .from("Inmorio")
                .select("*");


        console.log(
            "PROPIEDADES SUPABASE:",
            data
        );


        console.log(
            "ERROR SUPABASE:",
            error
        );


        if (error) {

            document
                .getElementById(
                    "propiedadesGrid"
                )
                .innerHTML = `

                    <p style="
                        text-align:center;
                    ">

                        ERROR:
                        ${error.message}

                    </p>

                `;

            return;

        }


        propiedades =
            data || [];


        mostrarPropiedades(
            "todas"
        );

    }



    /*
    =====================================
    MOSTRAR PROPIEDADES
    =====================================
    */

    window.mostrarPropiedades =
        function(categoria) {


            const container =
                document.getElementById(
                    "propiedadesGrid"
                );


            /*
            BOTONES
            */

            const botones =
                document.querySelectorAll(
                    ".categoria"
                );


            botones.forEach(
                boton => {

                    boton.classList.remove(
                        "activa"
                    );

                }
            );


            botones.forEach(
                boton => {

                    const texto =
                        boton.textContent
                            .trim()
                            .toLowerCase();


                    if (
                        categoria ===
                        "todas"
                    ) {

                        if (
                            texto ===
                            "todas"
                        ) {

                            boton.classList.add(
                                "activa"
                            );

                        }

                    }

                    else if (
                        texto.includes(
                            categoria
                        )
                    ) {

                        boton.classList.add(
                            "activa"
                        );

                    }

                }
            );



            /*
            FILTRAR
            */

            let filtradas =
                propiedades;


            if (
                categoria !==
                "todas"
            ) {

                filtradas =
                    propiedades.filter(
                        propiedad => {

                            return (
                                propiedad.tipo
                                    ?.toLowerCase()
                                    ===
                                categoria
                            );

                        }
                    );

            }



            /*
            SIN PROPIEDADES
            */

            if (
                filtradas.length === 0
            ) {

                container.innerHTML = `

                    <div style="
                        grid-column:1 / -1;
                        text-align:center;
                        padding:60px 20px;
                    ">

                        <h2>
                            No hay propiedades disponibles
                        </h2>

                        <p>
                            Actualmente no tenemos
                            propiedades de este tipo.
                        </p>

                    </div>

                `;

                return;

            }



            /*
            =====================================
            CREAR TARJETAS
            =====================================
            */

            container.innerHTML =
                filtradas.map(
                    propiedad => {


                        /*
                        OBTENER PRIMERA FOTO
                        */

                        const primeraImagen =
                            obtenerPrimeraImagen(
                                propiedad.imagen
                            );


                        return `

                        <article
                            class="
                                propiedad-card
                                propiedad
                                ${propiedad.tipo || ""}
                            "
                        >


                            <!-- IMAGEN -->

                            <div class="propiedad-imagen">


                                ${
                                    primeraImagen

                                    ?

                                    `
                                    <img
                                        src="${primeraImagen}"
                                        alt="${
                                            propiedad.nombre
                                            ||
                                            "Propiedad INMORIO"
                                        }"
                                        loading="lazy"
                                        onerror="
                                            this.style.display='none';
                                            this.parentElement
                                                .querySelector('.no-image')
                                                .style.display='flex';
                                        "
                                    >

                                    <div
                                        class="no-image"
                                        style="
                                            display:none;
                                            width:100%;
                                            height:100%;
                                            align-items:center;
                                            justify-content:center;
                                        "
                                    >
                                        SIN IMAGEN
                                    </div>
                                    `

                                    :

                                    `
                                    <div class="no-image">
                                        SIN IMAGEN
                                    </div>
                                    `

                                }



                                <!-- ESTADO -->

                                <span class="
                                    estado

                                    ${
                                        propiedad.estado
                                            ?.toLowerCase()
                                            ===
                                        "vendida"

                                        ? "vendida"

                                        : "disponible"
                                    }
                                ">

                                    ${
                                        propiedad.estado
                                        ||
                                        "DISPONIBLE"
                                    }

                                </span>


                            </div>



                            <!-- INFORMACIÓN -->

                            <div class="propiedad-info">


                                <p class="tipo-propiedad">

                                    ${
                                        propiedad.tipo
                                            ?.toUpperCase()
                                            ||
                                        "PROPIEDAD"
                                    }

                                </p>


                                <h2>

                                    ${
                                        propiedad.nombre
                                            ||
                                        "Propiedad INMORIO"
                                    }

                                </h2>


                                <p class="ubicacion">

                                    📍

                                    ${
                                        propiedad.ubicacion
                                            ||
                                        "Ubicación no disponible"
                                    }

                                </p>


                                <div class="propiedad-footer">


                                    <strong>

                                        $${
                                            Number(
                                                propiedad.precio
                                                ||
                                                0
                                            ).toLocaleString()
                                        }

                                    </strong>


                                    <a
                                        href="
                                            propiedad.html?id=${
                                                propiedad.id
                                            }
                                        "
                                    >

                                        VER MÁS

                                    </a>


                                </div>


                            </div>


                        </article>

                        `;

                    }
                ).join("");

        };



    /*
    =====================================
    INICIAR
    =====================================
    */

    cargarPropiedades();

</script>

</body>
